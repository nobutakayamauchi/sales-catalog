name: Apply Funnel Tracker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-funnel-tracker.yml'
      - 'scripts/apply_funnel_tracker.py'
      - 'assets/js/funnel-tracker.js'
      - 'assets/js/x-pixel-base.js'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tracker injection
        run: python scripts/apply_funnel_tracker.py

      - name: Commit generated HTML patch and redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/webai-bridge/sales.html \
                  products/webai-bridge/contact-complete.html \
                  products/webai-bridge/purchase-complete.html
          git commit -m 'Wire WebAI Bridge sales funnel tracker and X Pixel'
          git push
          gh workflow run catalog.yml --ref main
